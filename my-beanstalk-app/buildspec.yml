
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing Node.js dependencies"
      - npm install --prefix my-beanstalk-app

  build:
    commands:
      - test -f my-beanstalk-app/package.json
      - test -f my-beanstalk-app/server.js
      - echo "Node.js application files verified"

artifacts:
  base-directory: my-beanstalk-app
  files:
    - '**/*'
